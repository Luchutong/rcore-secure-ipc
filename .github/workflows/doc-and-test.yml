name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_TOOLCHAIN: stable
  RUST_TARGET: riscv64gc-unknown-none-elf

jobs:
  build-doc:
    name: Build Rust documentation
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        run: |
          rustup toolchain install "${RUST_TOOLCHAIN}" \
            --profile minimal \
            --component rust-src \
            --component llvm-tools-preview \
            --target "${RUST_TARGET}"

      - name: Build documentation
        working-directory: os
        run: cargo doc --no-deps --verbose

      - name: Upload documentation artifact
        uses: actions/upload-artifact@v7
        with:
          name: rustdoc-${{ github.sha }}
          path: os/target/${{ env.RUST_TARGET }}/doc
          if-no-files-found: error
          retention-days: 7

  run-tests:
    name: Run rCore user tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        run: |
          rustup toolchain install "${RUST_TOOLCHAIN}" \
            --profile minimal \
            --component rust-src \
            --component llvm-tools-preview \
            --target "${RUST_TARGET}"

      - name: Install cargo-binutils
        run: |
          if ! command -v rust-objcopy >/dev/null 2>&1; then
            cargo install cargo-binutils --locked
          fi

      - name: Cache QEMU source and build
        uses: actions/cache@v6
        with:
          path: qemu-7.0.0
          key: qemu-7.0.0-${{ runner.os }}-${{ runner.arch }}-riscv64

      - name: Install QEMU
        run: |
          sudo apt-get update
          sudo apt-get install autoconf automake autotools-dev curl libmpc-dev libmpfr-dev libgmp-dev \
            gawk build-essential bison flex texinfo gperf libtool patchutils bc \
            zlib1g-dev libexpat-dev pkg-config libglib2.0-dev libpixman-1-dev libsdl2-dev libslirp-dev \
            python3 python3-pip ninja-build -y
          if [ ! -d qemu-7.0.0 ]; then
            wget https://download.qemu.org/qemu-7.0.0.tar.xz
            tar -xf qemu-7.0.0.tar.xz
          fi
          cd qemu-7.0.0
          ./configure --target-list=riscv64-softmmu
          make -j"$(nproc)"
          sudo make install
          qemu-system-riscv64 --version

      - name: Run user tests
        working-directory: os
        run: make run TEST=1
        timeout-minutes: 10

  publish-doc:
    name: Publish documentation
    needs: build-doc
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Download documentation artifact
        uses: actions/download-artifact@v8
        with:
          name: rustdoc-${{ github.sha }}
          path: rustdoc

      - name: Publish to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: ./rustdoc
          destination_dir: main
          force_orphan: true
